<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layup Drawer</title>
</head>
<body>
    <canvas width="834" height="450" id="playground"></canvas>

    <script src="js/layup-drawer.js"></script>
    <script>
        var layup = {
            layers : [
                { id : 't1', thickness : 42.5, orientation : 0,  grade : 'MGP10' },
                { id : 't2', thickness : 45,   orientation : 90, grade : 'MGP6' },
                { id : 't3', thickness : 45,   orientation : 0,  grade : 'MGP6' },
                { id : 't4', thickness : 45,   orientation : 90, grade : 'MGP6' },
                { id : 't5', thickness : 42.5, orientation : 0,  grade : 'MGP10' }
            ]
        };

        var drawer = new LayupDrawer();
        drawer.init(document.getElementById('playground'));
        drawer.drawLayup(layup);
    </script>
</body>
</html>
